<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vpncell</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 8px; min-width: 420px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 4px 6px; border-bottom: 1px solid #ddd; }
  td.name { padding-left: 8px; }
  .ok { color: #058b00; } .bad { color: #d70022; font-weight: bold; }
  td.state { white-space: nowrap; }
  td.state .exitip { font-family: monospace; font-size: 11px; color: #555; margin-top: 2px; }
  td.state .why { white-space: normal; color: #d70022; font-size: 12px; margin-top: 2px; }
  td.state .reach { white-space: normal; color: #a15c00; font-size: 11px; max-width: 260px; }
  td.state .hint { white-space: normal; color: #666; font-size: 11px; max-width: 260px; }
  td.state details.reach summary { cursor: pointer; }
  td.state .routes { white-space: pre; font-family: monospace; font-size: 11px; max-height: 120px; overflow-y: auto; }
  tr.direct td { color: #888; } tr.direct select { opacity: .7; }
  .muted { color: #888; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 11px; font-weight: 600; line-height: 18px; }
  .pill.up { background: #dff3dc; color: #1d6b14; }
  .pill.down { background: #eee; color: #555; }
  .pill.connecting { background: #fff1cc; color: #8a5a00; }
  .pill.bad { background: #fde2e4; color: #b00020; }
  .chip { display: inline-block; margin: 2px 4px 0 0; padding: 0 6px; border-radius: 8px; background: #fff1cc; color: #8a5a00; font-size: 11px; cursor: help; }
</style>
</head>
<body>
<div id="root">Loading…</div>
<p style="color:#666">Only Multi-Account Containers can be mapped. Default tabs and private windows always connect directly.</p>
<script src="popup.js" type="module"></script>
</body>
</html>
